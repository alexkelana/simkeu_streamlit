[theme]
# ---------- Palet Warna SWAST — Hospital Handover Report ----------
# primaryColor: dark slate (#264653) — header tabel, judul, elemen interaktif
primaryColor = "#264653"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#264653"
linkColor = "#264653"
borderColor = "#d9d9d9"

# ---------- Warna status ----------
redColor = "#ef4444"
orangeColor = "#f59e0b"
yellowColor = "#eab308"
greenColor = "#10b981"
blueColor = "#264653"
violetColor = "#8b5cf6"
grayColor = "#64748b"

# ---------- Warna grafik (berdasarkan SWAST) ----------
# #264653 = dark slate (completed handovers bar)
# #7A9E9F = muted teal (predicted arrivals bar)
chartCategoricalColors = [
    "#264653",
    "#7A9E9F",
    "#2a9d8f",
    "#e9c46a",
    "#f4a261",
    "#e76f51",
    "#64748b",
]

chartSequentialColors = [
    "#f0f9ff",
    "#e0f2fe",
    "#bae0fd",
    "#93c5fd",
    "#60a5fa",
    "#3b82f6",
    "#2563eb",
    "#1d4ed8",
    "#1e40af",
    "#1e3a8a",
]

# ---------- Tipografi ----------
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false

# ---------- Border & radius ----------
baseRadius = "6px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true

# ---------- Sidebar ----------
[theme.sidebar]
backgroundColor = "#f0f2f6"
secondaryBackgroundColor = "#e9ecef"
textColor = "#264653"
borderColor = "#d9d9d9"
primaryColor = "#264653"

# ---------- Mode terang ----------
[theme.light]
primaryColor = "#264653"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#264653"
borderColor = "#d9d9d9"

[theme.light.sidebar]
backgroundColor = "#f0f2f6"

# ---------- Mode gelap ----------
[theme.dark]
primaryColor = "#7A9E9F"
backgroundColor = "#1a1a2e"
secondaryBackgroundColor = "#264653"
textColor = "#f0f2f6"
borderColor = "#4a4a6a"
linkColor = "#93c5fd"

[theme.dark.sidebar]
backgroundColor = "#1a1a2e"
secondaryBackgroundColor = "#264653"
textColor = "#f0f2f6"
borderColor = "#4a4a6a"
primaryColor = "#7A9E9F"
