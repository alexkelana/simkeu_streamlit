[theme]
# ---------- Palet Warna Instansi (Khusus) ----------
# primaryColor: teal/navy khas instansi — tombol utama, link, elemen interaktif
primaryColor = "#1a5f7a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7f9"
textColor = "#1f2937"
linkColor = "#1a5f7a"
borderColor = "#d1d5db"

# ---------- Warna status / indikator persentase ----------
# Digunakan oleh st.badge, colored markdown, dan indikator penggunaan pagu
redColor = "#dc2626"      # mendekati batas 90% / melebihi
orangeColor = "#d97706"   # penggunaan menengah (perhatian)
yellowColor = "#ca8a04"
greenColor = "#15803d"    # penggunaan aman / rendah
blueColor = "#1a5f7a"
violetColor = "#6d28d9"
grayColor = "#6b7280"

# ---------- Warna grafik variatif (bervariasi antar kategori) ----------
chartCategoricalColors = [
    "#1a5f7a",   # teal instansi
    "#2a9d8f",   # teal muda
    "#e9c46a",   # kuning muda
    "#f4a261",   # oranye muda
    "#e76f51",   # merah muda
    "#8ab6d6",   # biru langit
    "#64748b",   # abu-abu
]

chartSequentialColors = [
    "#eef4f7",
    "#dbe7ed",
    "#c8dae3",
    "#b5cdda",
    "#a2c0d1",
    "#8fb3c8",
    "#7ca6bf",
    "#6999b6",
    "#568cad",
    "#437fa4",
]

# ---------- Tipografi ----------
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false

# ---------- Border & radius ----------
baseRadius = "6px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true

# ---------- Header Tabel (Dataframe) ----------
dataframeHeaderBackgroundColor = "#1a5f7a"
dataframeBorderColor = "#d1d5db"

# ---------- Sidebar Navigasi (kontras tegas) ----------
[theme.sidebar]
backgroundColor = "#0f2d3e"   # navy gelap untuk memisahkan menu dari area utama
secondaryBackgroundColor = "#16455b"
textColor = "#e5edf1"
borderColor = "#1f4a5e"
primaryColor = "#7fd3e8"      # aksen terang di sidebar

# ---------- Mode terang ----------
[theme.light]
primaryColor = "#1a5f7a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7f9"
textColor = "#1f2937"
borderColor = "#d1d5db"
dataframeHeaderBackgroundColor = "#1a5f7a"
dataframeBorderColor = "#d1d5db"

[theme.light.sidebar]
backgroundColor = "#0f2d3e"
secondaryBackgroundColor = "#16455b"
textColor = "#e5edf1"
borderColor = "#1f4a5e"
primaryColor = "#7fd3e8"

# ---------- Mode gelap ----------
[theme.dark]
primaryColor = "#7fd3e8"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
borderColor = "#334155"
linkColor = "#93c5fd"
dataframeHeaderBackgroundColor = "#7fd3e8"
dataframeBorderColor = "#334155"

[theme.dark.sidebar]
backgroundColor = "#0b1a25"
secondaryBackgroundColor = "#16313e"
textColor = "#e5edf1"
borderColor = "#1f4a5e"
primaryColor = "#7fd3e8"
